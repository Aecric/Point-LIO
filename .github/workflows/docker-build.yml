name: Build ROS2 Humble ARM64 DEB (Release)

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: 'Parallel build jobs (QEMU emulation, keep low to avoid OOM)'
        required: false
        default: '2'
        type: string
      release_tag:
        description: 'Release tag (e.g. v0.1.0 or leave empty for timestamp)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # 需要写入 Release 的权限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          echo "=== Disk usage BEFORE cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          echo "=== Disk usage AFTER cleanup ==="
          df -h /

      - name: Set up 18GB swap space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 18G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - name: Show build environment
        run: |
          echo "Arch: $(uname -m), CPU: $(nproc)"
          free -h
          df -h /
          echo "BUILD_JOBS: ${{ inputs.build_jobs }}"

      - name: Build and extract DEB packages
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker2/Dockerfile
          platforms: linux/arm64
          target: export
          build-args: |
            BUILD_JOBS=${{ inputs.build_jobs }}
          outputs: type=local,dest=./deb_output

      - name: List generated DEB files
        run: |
          find deb_output -name "*.deb" -exec ls -lh {} \;
          FIRST_DEB=$(find deb_output -name "*.deb" | head -1)
          if [ -z "$FIRST_DEB" ]; then
              echo "ERROR: no .deb files found!"
              exit 1
          fi
          dpkg-deb -I "$FIRST_DEB"

      # -------------------------------------------------------------------
      # 计算 release tag: 用户输入优先, 否则用时间戳
      # -------------------------------------------------------------------
      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
              TAG="${{ inputs.release_tag }}"
          else
              TAG="build-$(date -u +'%Y%m%d-%H%M%S')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      # -------------------------------------------------------------------
      # 发布到 Release (不占 Actions artifact 配额!)
      # -------------------------------------------------------------------
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Point-LIO ARM64 DEB - ${{ steps.tag.outputs.tag }}"
          body: |
            ROS2 Humble Point-LIO DEB package for Jetson NX (ARM64).

            - Built from commit: ${{ github.sha }}
            - Target: Ubuntu 22.04 ARM64 / ROS2 Humble
            - Install: `sudo dpkg -i ros-humble-*.deb && sudo apt install -f`
          files: deb_output/*.deb
          draft: false
          prerelease: true    # 标记为预发布, 避免污染正式版列表
          make_latest: false